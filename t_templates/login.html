{% extends "base.html" %}

{% block conteudo %}
    <h1>Login</h1>
    <form method="post">
        <label for="usuario">Usuário</label>
        <input id="usuario" name="usuario" type="text" required>
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" required>
        <button type="submit">Entrar</button>
    </form>
{% endblock %}
