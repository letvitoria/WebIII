<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desenvolvimento Web III</title>
</head>
<body>
    
    <nav>
        <ul>
            <li><a href="{{ url_for('index') }}">Página Inicial</a></li>
            <li><a href="{{ url_for('contato') }}">Contatos</a></li>
            <li><a href="{{ url_for('dados_usuario') }}">Usuário</a></li>
            <li><a href="{{ url_for('formulario') }}">Formulário</a></li>
            <li><a href="{{ url_for('login') }}">Login</a></li>
        </ul>
    </nav>

    {% with mensagens = get_flashed_messages(with_categories=true) %}
        {% for categoria, mensagem in mensagens %}
            <p class="mensagem-flash {{ categoria }}">{{ mensagem }}</p>
        {% endfor %}
    {% endwith %}

    {% block conteudo %}
    {% endblock %}

    <h6>Desenvolvido por: Turma 2025</h6>
</body>
</html>
