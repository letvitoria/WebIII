{% extends "base.html" %}

{% block conteudo %}
    <h1>Formulário</h1>
    <form method="post">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" type="text" required>
        <button type="submit">Enviar</button>
    </form>
    {% if resultado %}
        <p>Nome informado: {{ resultado }}</p>
    {% endif %}
{% endblock %}
